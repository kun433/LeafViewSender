# LeafViewSender 配置
#
# 目标：只把玩家看得到的东西发给客户端，砍掉纯浪费的下行流量。
# 改动后执行 /leafviewsender reload 生效（不需要重启服务器）。
#
# 三个模块（可分别开关）：
#   1. 地形区块——视野扇形 + 近身缓冲之外的区块包直接丢弃，转身时按需补发；
#   2. 孤儿更新——我们丢过的区块，客户端根本没有，之后再在这些区块上发方块/光照更新纯属浪费；
#   3. 装饰流量——粒子（和可选的声音）按距离 + 视野裁剪。

# 总开关。false 时所有模块都不过滤（可用来临时排查问题）。
enabled: true

# ---------------------------------------------------------------------------
# 地形区块
# ---------------------------------------------------------------------------

# 水平视野总角度，单位度。
#   140 = 玩家正前方左右各 70° 的扇形会发送；
#   180 = 只发前半圈；
#   360 = 关闭方向过滤，只保留近身缓冲（退化成普通半径发送）。
# 说明：被过滤掉的区块客户端从来没有过，看不到就是空的，所以不要设得太小，
#       否则转身时会先看到一段空洞再被补上。
fov-degrees: 140

# 玩家所在区块周围，这个半径内的区块永远完整发送（圆形，单位：区块）。
# 这一项保证「脚下的地面」和「转身瞬间身边的方块」一定存在：
#   3 区块 ≈ 48 格，足以覆盖玩家脚下方块、近身战斗范围以及短距离跳跃落点。
near-radius-chunks: 3

# 每个玩家每次扫描最多补发多少个区块，控制转身瞬间的带宽峰值。
max-sends-per-tick: 4

# 参与计算的最大发送距离（区块）。
# 必须不小于服务器的 view-distance，否则最外圈区块在被拦下之后，转身时不会被补发（会留永久空洞）。
max-view-distance: 12

# 朝向变化超过这个角度就重新扫描一次视野。
yaw-threshold-degrees: 10

# 玩家静止时也每隔这么多 tick 重新扫描一次，
# 用于补发「扫描时区块还没加载完」的情况，以及服务端刚重启后的空档。
idle-rescan-ticks: 10

# 是否保留上一轮扫描的视野作为缓冲，减少快速转身时的近距离空洞。
keep-previous-view: true

# 转向预测：按玩家转视角的速度，提前补发「马上就会看到」的区块。
# 这是「让玩家感觉更流畅」最直接的一项：甩鼠标回头时不再先看到空白。
#   0 = 关闭（最省流量）；3 = 默认，大约提前 3 tick（150ms）；
#   提前量受 predictive-lookahead-max-degrees 限制，避免一次铺太多。
predictive-lookahead-ticks: 3
predictive-lookahead-max-degrees: 45

# ---------------------------------------------------------------------------
# 下行流量裁剪
# ---------------------------------------------------------------------------

traffic:
  # 孤儿更新：对我们丢过的区块（客户端没有）不再发送方块更新、多方块更新、光照更新、
  # 方块实体数据、方块破坏动画、方块事件、非全局的世界事件。
  # 客户端本来就会忽略这些包，丢掉不影响任何画面，纯省流量；红石/挖掘/爆炸多的服收益明显。
  orphan-updates: true

  # 粒子：纯装饰流量。原版只按 32 格半径广播，但对身后的玩家也会发，
  # 这里再按视野裁一次。近身缓冲范围内的粒子永远保留。
  particles:
    enabled: true
    max-distance: 32
    respect-view-cone: true

  # 声音：默认关闭——声音是听声辨位（背后苦力怕、脚步）的重要来源，裁掉会影响玩法。
  # 只在确实需要压带宽（比如大服、小水管）时再打开。
  sounds:
    enabled: false
    max-distance: 64
    respect-view-cone: false

  # 统计真实下行字节数（压缩、加密后的线路字节），用于 /leafviewsender status 显示 KB/s。
  wire-stats: true

# ---------------------------------------------------------------------------

# 不参与过滤的世界名（不区分大小写）。
worlds:
  blacklist: []
  # 例如：
  # blacklist:
  #   - lobby
  #   - resource_world

# 输出更详细的日志，排查问题时打开。
debug: false
